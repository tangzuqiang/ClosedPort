name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: closedport-windows
            pkg_script: dist:win
          - os: macos-latest
            artifact: closedport-macos
            pkg_script: dist:mac
          - os: ubuntu-latest
            artifact: closedport-linux
            pkg_script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build renderer + main
        run: npm run build

      - name: Package with electron-builder
        run: npm run ${{ matrix.pkg_script }}

      - name: List release directory
        shell: bash
        run: ls -la release

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: release
        run: |
          set -e
          shopt -s nullglob
          files=( *.exe *.dmg *.zip *.AppImage *.deb )
          if [ ${#files[@]} -gt 0 ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${files[@]}" > SHA256SUMS.txt
            else
              shasum -a 256 "${files[@]}" > SHA256SUMS.txt
            fi
            cat SHA256SUMS.txt
          else
            echo "No artifacts to checksum."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Show downloaded files
        run: find dist-artifacts -type f -printf '%p  %s bytes\n' | sort

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/latest*.yml
            dist-artifacts/**/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
